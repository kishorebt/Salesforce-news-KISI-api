name: Salesforce News Automation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
permissions:
  contents: write
concurrency:
  group: kisi-salesforce-news
  cancel-in-progress: false
jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate a relevant Salesforce news candidate
        run: python scripts/publish_news.py
      - name: Commit generated image
        run: |
          set -euo pipefail
          if [ -f candidate.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts/
            if ! git diff --cached --quiet; then
              git commit -m "Generate KISI Salesforce news graphic"
              git push
            fi
          else
            echo "No new story; no image commit needed."
          fi
