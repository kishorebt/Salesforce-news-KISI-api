
name: Salesforce News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  buffer-connection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Buffer API connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl --silent --show-error --fail \
            --request POST \
            --url https://api.buffer.com \
            --header "Authorization: Bearer ${BUFFER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"query":"query { account { organizations { id name } } }"}')

          echo "$RESPONSE" | jq -e '
            if .errors then
              error("Buffer API returned an error")
            elif .data.account.organizations then
              .data.account.organizations
            else
              error("Unexpected Buffer API response")
            end
          '
