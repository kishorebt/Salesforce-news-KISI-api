name: Salesforce News Automation
# Schedule + manual runs publish. Pushes only render a preview (never post).
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h, off the :00 rush so runs aren't delayed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (render + caption, no commit, no post)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/salesforce-news.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'queue/**'
permissions:
  contents: write
concurrency:
  group: kisi-salesforce-news
  cancel-in-progress: false
jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q 'Pillow>=11,<13'
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null || true

      - name: Manual queue first, then discover news
        env:
          KISI_DRY_RUN: ${{ env.PUBLISH == 'true' && '0' || '1' }}
        run: |
          echo "Mode: $([ "$PUBLISH" = true ] && echo PUBLISH || echo PREVIEW_ONLY) (event: ${{ github.event_name }})"
          python scripts/process_queue.py
          [ -f candidate.json ] || python scripts/publish_news.py

      - name: Upload preview
        if: ${{ hashFiles('candidate.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kisi-post-preview
          path: |
            candidate.json
            posts/*.png
          retention-days: 14

      - name: Host image (commit to posts/)
        id: host
        if: ${{ env.PUBLISH == 'true' && hashFiles('candidate.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IMG=$(python -c "import json;print(json.load(open('candidate.json'))['image_path'])")
          git add "$IMG"
          git commit -q -m "Add KISI news graphic $(basename "$IMG")"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            echo "push retry $i"; sleep $((i*5))
            [ $i = 5 ] && { echo "FAILED could not push image"; exit 1; }
          done
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$IMG"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL"); [ "$CODE" = 200 ] && break; sleep 5
          done
          [ "$CODE" = 200 ] || { echo "FAILED image not publicly reachable ($CODE): $URL"; exit 1; }
          echo "IMAGE_HOSTED $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish to KISI LinkedIn via Buffer
        if: ${{ steps.host.outcome == 'success' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IMAGE_URL: ${{ steps.host.outputs.url }}
        run: python scripts/submit_candidate.py

      - name: Save duplicate-prevention state
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
          set -euo pipefail
          git add -A data/published.json queue/ 2>/dev/null || git add data/published.json
          git diff --cached --quiet && { echo "No state change"; exit 0; }
          git commit -q -m "Record KISI publication state"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            echo "push retry $i"; sleep $((i*5))
          done
          echo "FAILED could not save state"; exit 1
